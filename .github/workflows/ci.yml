name: Plugin checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm pack --pack-destination .test-output
      - run: node scripts/verify-pack.mjs .test-output/dsh-agent-router-0.2.1.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-package
          path: .test-output/*.tgz
